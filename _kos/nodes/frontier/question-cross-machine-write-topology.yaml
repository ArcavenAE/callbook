id: question-cross-machine-write-topology
type: question
confidence: frontier
title: "Cross-machine write topology for rapid agent-fleet workloads"
content: |
  The growth path (docs/growth-path.md Step 3) and topology map
  (docs/patterns.md §4) present working-copies-with-a-hub as the
  distributed default: each machine writes to its own local store and
  syncs with a hub like git. That default assumes a coordination regime
  it also documents: one active editor per bead, claim before edit,
  discuss in comments not fields, and "if this happens weekly you have a
  convention problem."

  finding-003 confirms that regime does not hold for the intended
  workload: many autonomous agents writing concurrently on each of
  several machines, any agent touching any ticket, at machine speed.
  callbook's own measurements show same-bead cross-machine edits conflict
  almost always (the shared updated_at cell), there is no automatic
  resolver (raw-dolt runbook only), and dolt's cross-machine transport is
  single-writer-per-branch fast-forward, not multi-master. The
  discipline-based middle position (local write authority to a SHARED
  bead namespace + git-like sync + coordinate by hand) is the one point
  that cannot survive rapid autonomous multi-writer.

  Open question: which topology replaces pattern 4 as the agent-fleet
  default. Three candidates from finding-003:
    A. Partition write authority by machine/site. STRUCK (finding-004):
       violates the fundamental goal of massively distributed agents
       working on the SAME projects at the SAME time. A disjoint bead
       slice per machine is the exact thing the goal forbids. Removed
       from consideration.
    B. Coordinate at write time: central hub / thin clients (pattern 3),
       or a strongly-consistent distributed SQL DB (CockroachDB,
       Yugabyte, Spanner) where every node accepts every write and the
       store coordinates internally. Any agent writes any bead; keeps SQL
       and invariants; cost is write latency and no offline. Contradicts
       the local-first priority.
    C. Build or adopt a substrate with conflict-free merge (LWW on
       updated_at or field-level CRDT) for true unrestricted
       multi-master. The only path that makes "any agent, any bead, any
       machine, converges" work as pattern 4 silently assumes. Does not
       exist in bd/dolt; upstream-scale engineering. The 2026 substrate
       survey (_kos/ideas/conflict-free-versioned-db-substrate-landscape.md)
       finds no off-the-shelf system is versioned AND conflict-free AND
       SQL at once: document CRDTs (Loro, Automerge) are versioned +
       conflict-free but not SQL; cr-sqlite is SQL + conflict-free but
       drops history. Any adoption is a bd-successor store, since bd is
       dolt-coupled.

  Governing constraint (finding-004): CALM. Coordination-free convergence
  is possible iff the workload is monotonic. Non-monotonic invariants
  (unique id at creation, at-most-one-claim, no-close-with-open-children)
  provably require coordination; no substrate escapes this. So the choice
  reduces to two horns: B (coordinate at write) or C (CRDT, give up
  enforced invariants), or a hybrid (CRDT for the monotonic majority +
  a coordination sidecar for the few non-monotonic checks). The deciding
  input is an invariant inventory, not a substrate pick. callbook's
  "one active editor per bead, claim before edit" was a hidden manual
  coordination protocol for exactly the invariant CALM forbids for free.

  Reframe (finding-005): the operator's non-negotiable of 2026-08-16
  (multi-agent, multi-author; agents claim work under their own
  identities) lives on the identity and coordination planes, which are
  orthogonal to this node's topology question. Multi-author does not
  require multi-master; bd's own atomic --claim is many-authors-against-
  one-store by design. Today's deployment is central AND mono-identity;
  the mono-identity is the defect (callbook B3 designed the fix; bd
  1.1.2 ships a dormant agent-identity/liveness schema; orc finding-123
  picked the stamping mechanism; nothing is wired). First confirmed
  member of the invariant inventory: at-most-one-claim. The claim path
  requires a coordinated store on every workable topology.

  Sub-questions:
    - THE deciding question: which bead operations must enforce an
      invariant globally and immediately across all agents, versus which
      can converge after the fact? That inventory selects horn B, C, or
      hybrid. First confirmed member: at-most-one-claim (finding-005),
      which is horn-B-shaped regardless of what the rest of the
      inventory says.
    - What is the natural partition key for option A (project label,
      id-prefix, assignment)? Does bd's label-carried project membership
      (orc finding-044) supply it directly?
    - Read replication of others' slices: ANSWERED for the loopback
      case (read-replica recipe shipped 2026-08-16: persisted
      dolt_read_replica_remote pull-on-read, hub-down serves
      last-known data; TLS-production-hub verification remains).
    - Does local write throughput even hold? MEASURED (finding-008):
      ~18 mutating ops/s per instance, ceiling is the process-per-op
      bd CLI not dolt, graceful saturation, claims exactly-once under
      race. ~500 agents per instance at one write per 30s.
    - If option C is ever pursued, is it a bd upstream contribution
      (charter F5/F6) or a callbook-side merge driver?
