notes: >
  Reopens a decision that growth-path Step 3 and patterns.md §4 present
  as settled. finding-003 qualifies those docs rather than contradicting
  them: pattern 4 stays valid for human-pace, partitionable-work teams,
  which is the deployment it was measured on. The validity-domain caveat
  and the direction rewrite are a deliberate harvest pass, not done in
  finding-003.

  HARVEST 2026-08-16: the direction rewrite promised by finding-003's
  notes is done. patterns.md gains pattern 5 (central write plane +
  edge read replicas, honesty-labeled design) with pattern 4 carrying
  its validity domain and federation/capstone renumbered 6/7;
  growth-path splits step 3 by pace and adds the step-1 actor rule;
  vision adds the coordination problem + the claims-are-locks
  principle + spawner-stamps + the rig direction; README adds the
  fleet mode + opinion 6; local-instance adds the fleet role;
  sync-conflicts is scope-limited to human pace; charter opens F10.

  OPERATOR RULING 2026-08-16: the finding-005 plane-split is ratified.
  The multi-author requirement is satisfied on the identity plane; no
  standing requirement needs distributed writes. The write plane is a
  coordinated store (horn B) for the claim path and invariants; option C
  remains only as a far-horizon substrate question.

  FAN-OUT 2026-08-16 (five forks): throughput measured (finding-008),
  liveness and rig answered (finding-007: adopt upstream leases at a
  tested release; rig means store, locus rides the actor string),
  replica recipe shipped loopback-verified, actor stamping live
  (client-env default + marvel PR #196). Upstream independently
  converged on the central-write-plane conclusion (node-local lease
  enforcement). Remaining open narrows to: TLS-hub replica
  verification, the tested-release watch for the lease line, name-pool
  ratification, and the drill (aae-orc-khl5v).
