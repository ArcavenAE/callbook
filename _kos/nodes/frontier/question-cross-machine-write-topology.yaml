notes: >
  Reopens a decision that growth-path Step 3 and patterns.md §4 present
  as settled. finding-003 qualifies those docs rather than contradicting
  them: pattern 4 stays valid for human-pace, partitionable-work teams,
  which is the deployment it was measured on. The validity-domain caveat
  and the direction rewrite are a deliberate harvest pass, not done in
  finding-003.
